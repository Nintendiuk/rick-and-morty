services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: rick_and_morty_db
      POSTGRES_USER: rick_and_morty_user
      POSTGRES_PASSWORD: rick_and_morty_password
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: django_app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: celery_worker
    command: celery -A rick_and_morty_api worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env

  celery-beat:
    build: .
    container_name: celery_beat
    command: celery -A rick_and_morty_api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env

  flower:
    build: .
    container_name: flower_monitor
    command: celery -A rick_and_morty_api flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - celery
      - redis
    env_file:
      - .env
